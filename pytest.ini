[pytest]

# Configuration file for pytest
testpaths = tests

# Allows pytest to collect tests from files matching the specified patterns
addopts = --cov=app --cov-report=term-missing --cov-report=html

# Specifies the naming conventions for test files, classes, and functions
python_files = test_*.py *_test.py

# Specifies the naming conventions for test classes and functions
python_classes = Test*

# Specifies the naming conventions for test functions
python_functions = test_*

# Defines custom markers for categorizing tests
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    fast: marks tests as fast (deselect with '-m "not fast"')

# Optional: Configure logging for pytest
# plugins =
#   plugin1
#   plugin2

# Optional: adjust logging level for pytest output
# log_level = INFO